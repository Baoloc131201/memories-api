spring.application.name=memories-api
# Render tự đặt biến PORT
server.port=${PORT:8081}
# Đứng sau proxy (Render, Cloudflare) thì đọc X-Forwarded-*
server.forward-headers-strategy=framework

# Đọc biến môi trường từ file .env (không commit file này)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=./uploads

# Nơi lưu ảnh: local (thư mục app.upload-dir, dùng ở máy), db (bảng memory_images, dùng khi deploy gói free)
# hoặc r2 (Cloudflare R2)
app.storage.type=${STORAGE_TYPE:local}
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
# true = lúc khởi động chuyển ảnh cũ trong app.upload-dir sang nơi lưu đang chọn (db / r2), chạy 1 lần ở máy
app.storage.migrate-local=${MIGRATE_LOCAL_UPLOADS:false}

# JWT - change this secret in production (min 32 chars)
app.jwt.secret=${JWT_SECRET:change-me-please-this-is-a-very-long-dev-secret-key-123456}
# Access token sống 15 phút, hết hạn thì FE gọi /api/auth/refresh để lấy token mới
app.jwt.access-expiration-ms=900000
# Refresh token sống 7 ngày (tính từ lần refresh gần nhất)
app.jwt.refresh-expiration-ms=604800000
# Bật true khi chạy HTTPS (production)
app.jwt.cookie-secure=${COOKIE_SECURE:false}

# Đăng nhập bằng Google / Facebook (để trống thì nút tương ứng bị ẩn ở FE)
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.facebook.app-id=${FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# Địa chỉ web FE, dùng để tạo link đặt lại mật khẩu trong email
app.frontend-url=${APP_URL:http://localhost:5173}

# Gửi email (quên mật khẩu). Chọn 1 trong 2, để trống cả 2 thì nội dung email chỉ được ghi ra log:
# - Brevo HTTP API: dùng khi deploy (Render free chặn cổng SMTP). MAIL_FROM phải là sender đã xác minh trên Brevo
# - SMTP (vd. Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=<gmail>, MAIL_PASSWORD=<App Password 16 ký tự>)
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# CORS
# Phân tách bằng dấu phẩy, hỗ trợ wildcard cổng: http://localhost:[*]
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
