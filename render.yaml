# Render Blueprint: New > Blueprint > chọn repo này. Các biến sync: false sẽ được hỏi khi tạo.
services:
  - type: web
    name: memories-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/auth/providers
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      # Ảnh lưu trong Neon (ổ đĩa Render free bị xoá mỗi lần khởi động lại)
      - key: STORAGE_TYPE
        value: db
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # Quên mật khẩu: link trong email trỏ về APP_URL, gửi mail qua Brevo (Render free chặn SMTP)
      - key: APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
